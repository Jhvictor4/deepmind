<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a1a;
      color: #ffffff;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .logo-icon {
      width: 24px;
      height: 24px;
      background: #4285f4;
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .info {
      font-size: 13px;
      color: #bbb;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #2a2a2a;
      border-radius: 6px;
      font-size: 13px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #999;
    }

    .dot.connected {
      background: #34a853;
    }

    .status-text {
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-icon"></div>
    <h1>SafeNav</h1>
  </div>

  <p class="info">
    Voice-guided browser navigation.<br>
    Click the SafeNav bar on any page to start a session.
  </p>

  <div class="status-row">
    <div class="dot" id="dot"></div>
    <span class="status-text" id="status">Checking server...</span>
  </div>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
