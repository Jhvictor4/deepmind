<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeNav</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #F8FAFC;
      color: #1E293B;
      padding: 24px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .logo {
      width: 36px;
      height: 36px;
      background: #2563EB;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 16px;
      flex-shrink: 0;
    }

    .header-text h1 {
      font-size: 18px;
      font-weight: 700;
      color: #1E293B;
      line-height: 1.2;
    }

    .header-text p {
      font-size: 11px;
      color: #64748B;
      font-weight: 500;
    }

    .description {
      font-size: 13px;
      color: #475569;
      line-height: 1.5;
      margin-bottom: 20px;
      padding: 12px;
      background: #EFF6FF;
      border-radius: 8px;
      border: 1px solid #DBEAFE;
    }

    .description strong {
      color: #2563EB;
    }

    .start-btn {
      width: 100%;
      padding: 14px 20px;
      background: #2563EB;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .start-btn:hover {
      background: #1D4ED8;
    }

    .start-btn:active {
      transform: scale(0.98);
    }

    .start-btn svg {
      width: 18px;
      height: 18px;
    }

    .footer {
      margin-top: 16px;
      text-align: center;
      font-size: 11px;
      color: #94A3B8;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">SN</div>
    <div class="header-text">
      <h1>SafeNav</h1>
      <p>Voice Web Assistant</p>
    </div>
  </div>

  <div class="description">
    <strong>How it works:</strong> SafeNav connects you to an AI voice assistant that can see your screen and help you navigate complex websites step by step.
  </div>

  <button class="start-btn" id="startBtn">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <line x1="12" y1="19" x2="12" y2="23"/>
      <line x1="8" y1="23" x2="16" y2="23"/>
    </svg>
    Start SafeNav
  </button>

  <div class="footer">Click to open the voice assistant session</div>

  <script src="popup.js"></script>
</body>
</html>
