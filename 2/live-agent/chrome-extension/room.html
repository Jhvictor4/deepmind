<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeNav - Voice Session</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #F8FAFC;
      color: #1E293B;
      min-height: 100vh;
    }

    /* Top navigation bar */
    .navbar {
      background: white;
      border-bottom: 1px solid #E2E8F0;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .navbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 32px;
      height: 32px;
      background: #2563EB;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 13px;
      flex-shrink: 0;
    }

    .navbar h1 {
      font-size: 18px;
      font-weight: 700;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      background: #F1F5F9;
      color: #64748B;
      transition: all 0.3s ease;
    }

    .status-badge.connected {
      background: #ECFDF5;
      color: #10B981;
    }

    .status-badge.connecting {
      background: #FEF3C7;
      color: #F59E0B;
    }

    .status-badge.error {
      background: #FEF2F2;
      color: #EF4444;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #94A3B8;
      transition: background 0.3s ease;
    }

    .status-badge.connected .status-dot {
      background: #10B981;
      animation: pulse 2s infinite;
    }

    .status-badge.connecting .status-dot {
      background: #F59E0B;
      animation: pulse 1s infinite;
    }

    .status-badge.error .status-dot {
      background: #EF4444;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Main content */
    .main {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px;
    }

    /* Connection form */
    .connection-card {
      background: white;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .connection-card h2 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #CBD5E1;
      border-radius: 8px;
      font-size: 14px;
      color: #1E293B;
      background: #F8FAFC;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-group input:focus {
      border-color: #2563EB;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .form-group input::placeholder {
      color: #94A3B8;
    }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #2563EB;
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: #1D4ED8;
    }

    .btn-secondary {
      background: #F1F5F9;
      color: #475569;
      border: 1px solid #E2E8F0;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #E2E8F0;
    }

    .btn-danger {
      background: #FEF2F2;
      color: #EF4444;
      border: 1px solid #FECACA;
    }

    .btn-danger:hover:not(:disabled) {
      background: #FEE2E2;
    }

    .btn-success {
      background: #ECFDF5;
      color: #10B981;
      border: 1px solid #A7F3D0;
    }

    .btn-success:hover:not(:disabled) {
      background: #D1FAE5;
    }

    /* Controls section */
    .controls-card {
      background: white;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      display: none;
    }

    .controls-card.visible {
      display: block;
    }

    .controls-card h2 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .controls-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .mic-status, .screen-status {
      font-size: 12px;
      color: #64748B;
      padding: 4px 10px;
      background: #F1F5F9;
      border-radius: 4px;
    }

    .mic-status.active, .screen-status.active {
      background: #ECFDF5;
      color: #10B981;
    }

    /* Transcription section */
    .transcription-card {
      background: white;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 24px;
      display: none;
    }

    .transcription-card.visible {
      display: block;
    }

    .transcription-card h2 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .transcription-log {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      padding: 16px;
      min-height: 200px;
      max-height: 400px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.6;
    }

    .transcription-log .message {
      padding: 8px 12px;
      margin-bottom: 8px;
      border-radius: 6px;
      animation: fadeIn 0.3s ease;
    }

    .transcription-log .message.agent {
      background: #EFF6FF;
      border-left: 3px solid #2563EB;
    }

    .transcription-log .message.user {
      background: #F0FDF4;
      border-left: 3px solid #10B981;
    }

    .transcription-log .message.system {
      background: #F1F5F9;
      border-left: 3px solid #94A3B8;
      font-size: 12px;
      color: #64748B;
    }

    .transcription-log .message .sender {
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .transcription-log .message.agent .sender {
      color: #2563EB;
    }

    .transcription-log .message.user .sender {
      color: #10B981;
    }

    .transcription-log .message.system .sender {
      color: #94A3B8;
    }

    .transcription-log .empty-state {
      text-align: center;
      color: #94A3B8;
      padding: 40px 20px;
      font-size: 13px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Audio level indicator */
    .audio-indicator {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px 0;
    }

    .audio-bar {
      width: 3px;
      height: 12px;
      background: #CBD5E1;
      border-radius: 2px;
      transition: height 0.1s ease;
    }

    .audio-indicator.active .audio-bar {
      background: #10B981;
      animation: audioWave 0.8s ease-in-out infinite;
    }

    .audio-indicator.active .audio-bar:nth-child(1) { animation-delay: 0s; }
    .audio-indicator.active .audio-bar:nth-child(2) { animation-delay: 0.15s; }
    .audio-indicator.active .audio-bar:nth-child(3) { animation-delay: 0.3s; }
    .audio-indicator.active .audio-bar:nth-child(4) { animation-delay: 0.45s; }

    @keyframes audioWave {
      0%, 100% { height: 6px; }
      50% { height: 18px; }
    }
  </style>
</head>
<body>

  <!-- Top navigation -->
  <nav class="navbar">
    <div class="navbar-left">
      <div class="logo">SN</div>
      <h1>SafeNav</h1>
    </div>
    <div class="status-badge" id="statusBadge">
      <span class="status-dot"></span>
      <span id="statusText">Disconnected</span>
    </div>
  </nav>

  <!-- Main content -->
  <div class="main">

    <!-- Connection form -->
    <div class="connection-card" id="connectionCard">
      <h2>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        Connect to LiveKit Room
      </h2>
      <div class="form-group">
        <label for="livekitUrl">LiveKit Server URL</label>
        <input type="text" id="livekitUrl" placeholder="wss://your-server.livekit.cloud" />
      </div>
      <div class="form-group">
        <label for="livekitToken">Access Token</label>
        <input type="text" id="livekitToken" placeholder="Paste your LiveKit access token" />
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="connectBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg>
          Connect
        </button>
      </div>
    </div>

    <!-- Session controls (shown after connecting) -->
    <div class="controls-card" id="controlsCard">
      <h2>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Session Controls
      </h2>
      <div class="controls-row">
        <button class="btn btn-success" id="shareScreenBtn" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          Share Screen
        </button>
        <button class="btn btn-danger" id="disconnectBtn" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          Disconnect
        </button>
        <div class="audio-indicator" id="audioIndicator">
          <div class="audio-bar"></div>
          <div class="audio-bar"></div>
          <div class="audio-bar"></div>
          <div class="audio-bar"></div>
        </div>
        <span class="mic-status" id="micStatus">Mic: Off</span>
        <span class="screen-status" id="screenStatus">Screen: Off</span>
      </div>
    </div>

    <!-- Transcription log -->
    <div class="transcription-card" id="transcriptionCard">
      <h2>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Transcription
      </h2>
      <div class="transcription-log" id="transcriptionLog">
        <div class="empty-state">
          Transcriptions from the AI assistant will appear here once connected.
        </div>
      </div>
    </div>

  </div>

  <!-- LiveKit Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.js"></script>
  <script src="room.js"></script>
</body>
</html>
